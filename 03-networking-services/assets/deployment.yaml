apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: pratice-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: api
        image: nginx:1.25
        ports:
        - containerPort: 80