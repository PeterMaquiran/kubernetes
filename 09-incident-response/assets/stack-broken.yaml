apiVersion: v1
kind: Namespace
metadata:
  name: acme-payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: acme-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-api
      version: v3
  template:
    metadata:
      labels:
        app: payment-api
        version: v3
    spec:
      containers:
      - name: api
        image: nginx:1.25
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: acme-payments
spec:
  selector:
    app: payment-api
    version: v2
  ports:
  - port: 80
    targetPort: 80