apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-cache
  namespace: acme-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-cache
  template:
    metadata:
      labels:
        app: session-cache
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: session-cache
            topologyKey: kubernetes.io/hostname
      containers:
      - name: redis
        image: redis:7.2-alpine
        resources:
          requests:
            cpu: 50m
            memory: 64Mi