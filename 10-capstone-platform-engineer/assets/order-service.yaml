apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: app
        image: curlimages/curl:8.5.0
        command:
        - sh
        - -c
        - |
          while true; do
            curl -sf http://payment-api/ >/dev/null && echo "$(date) order->payment OK" || echo "$(date) order->payment FAIL"
            sleep 10
          done
        resources:
          requests:
            cpu: 25m
            memory: 32Mi