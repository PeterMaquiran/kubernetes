apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime
  namespace: acme-production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-reader
  namespace: acme-production
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-reader
  namespace: acme-production
subjects:
- kind: ServiceAccount
  name: runtime
  namespace: acme-production
roleRef:
  kind: Role
  name: runtime-reader
  apiGroup: rbac.authorization.k8s.io