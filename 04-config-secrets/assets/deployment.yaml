apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: pratice-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "env | grep -E 'LOG_LEVEL|DB_USER' && sleep 3600"]
        envFrom:
        - configMapRef:
            name: order-service-config
        env:
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: order-service-db
              key: DB_USER