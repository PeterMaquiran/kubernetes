apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: pratice-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo starting && sleep 5 && exit 1"]
        livenessProbe:
          exec:
            command: ["true"]
          initialDelaySeconds: 2
          periodSeconds: 5