apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: pratice-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-worker
  template:
    metadata:
      labels:
        app: notification-worker
    spec:
      containers:
      - name: worker
        image: busybox:1.36
        command: ["sh", "-c", "echo worker healthy && sleep 3600"]
        livenessProbe:
          exec:
            command: ["sh", "-c", "test -f /tmp/healthy || exit 1"]
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          exec:
            command: ["true"]
          periodSeconds: 5